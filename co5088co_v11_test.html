<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>@co5088co • Thả đèn cầu phúc V11</title><style>*{box-sizing:border-box}body{margin:0;background:#071727;color:#ffe7aa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center}header{padding:24px 10px 14px;background:linear-gradient(#071727,#173a51);border-bottom:2px solid #d9b766}h1{margin:0;font-size:clamp(27px,7vw,40px)}.sub{font-size:15px;margin:10px 0}.stats{font-size:25px;color:white}.river{height:42vh;min-height:300px;position:relative;overflow:hidden;background:linear-gradient(#14344d,#0e5470);border-bottom:2px solid #d9b766}.river:after{content:'';position:absolute;inset:45% -30%;background:repeating-linear-gradient(175deg,transparent 0 29px,#ffffff12 30px 32px,transparent 34px 63px);pointer-events:none}.prayer{position:absolute;top:15%;width:100%;font-size:23px;z-index:1}.prayer .hands{font-size:72px}.lantern{position:absolute;bottom:-80px;font-size:40px;animation:float 8s linear forwards;filter:drop-shadow(0 0 15px #ffd44e)}@keyframes float{to{transform:translateY(-500px) translateX(35px);opacity:0}}.controls{padding:18px 10px 36px}.hint{margin:0 0 15px}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;border:2px solid #e9c87c;border-radius:17px;padding:15px 13px;font-size:19px;font-weight:700;color:white;background:#853846;min-height:56px}button:active{transform:scale(.97)}.audio{background:#25627a}.status{font-size:14px;color:#fff0be;margin:14px 0;min-height:22px}.overlay{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:10;padding:18px}.overlay.show{display:flex}.deity{position:relative;width:min(92vw,420px);padding:20px 14px 25px;border:2px solid #f5d47e;border-radius:24px;background:radial-gradient(circle at 50% 32%,#ffe991 0,#a36d17 28%,#3d230c 58%,#130d16 100%);box-shadow:0 0 50px #ffce52a0;animation:glow 1.3s alternate infinite}@keyframes glow{to{box-shadow:0 0 90px #ffdf83}}.figure{font-size:115px;filter:drop-shadow(0 0 16px gold)}.deity h2{font-size:27px;margin:4px}.deity p{color:#fff}.close{background:#21485b}</style></head><body><header><h1>🪷 @co5088co</h1><p class="sub">THẢ ĐÈN CẦU PHÚC · Bình an · Sức khỏe · Tài lộc</p><div class="stats">🌹 <span id="roses">0</span>　🏮 <span id="lights">0</span></div></header><main><section class="river" id="river"><div class="prayer"><div class="hands">🙏</div>Cầu Bình An</div></section><section class="controls"><p class="hint">Chạm vào món quà để thả hoa đăng ✨</p><div class="buttons"><button id="rose" type="button">🌹 Hoa hồng ×1</button><button id="heart" type="button">💗 Trái tim</button><button id="gift" type="button">🎁 Quà lớn</button><button id="special" type="button">🪷 Cầu phúc</button></div><div class="buttons" style="margin-top:13px"><button class="audio" id="audio" type="button">🔊 Bật âm thanh / Test</button><button id="reset" type="button">↺ Làm mới</button></div><p class="status" id="status">Chạm nút âm thanh để thử tiếng chuông trên Safari.</p><small>BẢN THỬ V11 · Chưa kết nối TikTok LIVE</small></section></main><div class="overlay" id="overlay"><div class="deity"><div class="figure" id="figure">🙏</div><h2 id="deityName"></h2><p id="blessing"></p><button class="close" id="close">Đóng ✕</button></div></div><script>(function(){'use strict';var roses=0,lights=0,ctx=null;function el(id){return document.getElementById(id)}function status(s){el('status').textContent=s}function sound(notes){try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC){status('Trình duyệt không hỗ trợ âm thanh');return}if(!ctx)ctx=new AC();ctx.resume();var start=ctx.currentTime+.025;notes.forEach(function(n,i){var o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=n;o.connect(g);g.connect(ctx.destination);var t=start+i*.18;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.23,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+.45);o.start(t);o.stop(t+.48)});}catch(e){status('Lỗi âm thanh: '+e.message)}}function lamp(count){for(var i=0;i<count;i++){var l=document.createElement('span');l.className='lantern';l.textContent=['🏮','🪷','🕯️'][i%3];l.style.left=(10+Math.random()*75)+'%';l.style.animationDelay=(i*.2)+'s';el('river').appendChild(l);setTimeout((function(x){return function(){x.remove()}})(l),9500)}}function update(r,l){roses+=r;lights+=l;el('roses').textContent=roses;el('lights').textContent=lights;lamp(l);sound([660,880,1100]);status('Đã thả '+l+' hoa đăng ✨')}function deity(name,icon,msg){el('deityName').textContent=name;el('figure').textContent=icon;el('blessing').textContent=msg;el('overlay').classList.add('show')}el('audio').addEventListener('click',function(){sound([523,659,784,1047]);status('Đã nhấn thử âm thanh 🔔 · Nếu không nghe, hãy tắt chế độ im lặng và tăng âm lượng')});el('rose').addEventListener('click',function(){update(1,1)});el('heart').addEventListener('click',function(){update(0,3);deity('Quan Âm Bồ Tát','🙏','Nguyện bình an và lòng từ bi')});el('gift').addEventListener('click',function(){update(0,8);deity('A Di Đà Phật','🪷','Nguyện phúc lành và an lạc')});el('special').addEventListener('click',function(){update(0,5);deity('Phật Di Lặc','✨','Nguyện hạnh phúc và tài lộc')});el('close').addEventListener('click',function(){el('overlay').classList.remove('show')});el('overlay').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')});el('reset').addEventListener('click',function(){roses=lights=0;el('roses').textContent='0';el('lights').textContent='0';document.querySelectorAll('.lantern').forEach(function(x){x.remove()});status('Đã làm mới')});})();</script></body></html>
