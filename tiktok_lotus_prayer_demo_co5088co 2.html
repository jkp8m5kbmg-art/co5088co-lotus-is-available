n+JIbQazoMZe01O1tMf8Sg5/4lJHHyj7wY5TI544rqPBX3viD/ANgE/wAq8Lm/4+5f+waf/Zq/VcNCN7evTt8/w02urbH8X53OXf8AC/2f679/KNz7H7frS/Y7f1P5VfqvXSfHn//Z') center/cover no-repeat}#stage:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#020d20b8 0%,transparent 23%,transparent 58%,#03142c9e 100%);pointer-events:none}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.top{position:absolute;top:env(safe-area-inset-top,10px);left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;align-items:center;z-index:5}.tag{background:#07142bbd;border:1px solid #d8ac5e99;border-radius:22px;padding:9px 12px;font-size:13px;backdrop-filter:blur(7px)}.tag b{color:#ffe6a4}.heading{position:absolute;top:12%;width:100%;text-align:center;text-shadow:0 3px 15px #000;z-index:2;pointer-events:none}.heading h1{font-size:clamp(22px,6vw,34px);color:#ffe2a1;margin:0;letter-spacing:.5px}.heading p{margin:5px 0;font-size:13px;color:#fff2cf}.buddha{position:absolute;top:23%;left:50%;transform:translateX(-50%);width:160px;height:165px;display:grid;place-items:center;z-index:2;pointer-events:none}.halo{position:absolute;width:143px;height:143px;border-radius:50%;background:radial-gradient(circle,#ffedb6aa 0%,#ffb82a55 35%,#ffc84b11 67%,transparent 75%);box-shadow:0 0 35px 12px #ffd46c66;animation:breathe 4s ease-in-out infinite}.buddha span{position:relative;font-size:91px;filter:drop-shadow(0 0 20px #fbbf46);line-height:1}.buddha.pulse .halo{animation:flash .65s ease-in-out 4}@keyframes breathe{50%{transform:scale(1.12);opacity:.75}}@keyframes flash{50%{transform:scale(1.55);background:#ffeabf;box-shadow:0 0 90px 60px #ffe39aaa}}.wish{position:absolute;top:47%;left:7%;width:86%;text-align:center;background:#07162caa;border:1px solid #e7bd6f88;border-radius:15px;padding:10px;z-index:3;box-shadow:0 0 24px #07152a88}.wish strong{font-size:18px;color:#ffdc83}.wish small{display:block;margin-top:5px;color:#ffedcc}.counter{position:absolute;top:59%;right:12px;background:#07142bcc;border:1px solid #efc56a99;border-radius:13px;padding:8px 10px;z-index:3;font-size:12px;max-width:55%}.counter b{font-size:17px;color:#ffe29c}.toast{position:absolute;top:69%;width:100%;text-align:center;font-weight:700;color:#ffedb6;text-shadow:0 2px 12px #000;z-index:4;pointer-events:none;opacity:0;transition:opacity .25s}.toast.show{opacity:1}.bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:12px;right:12px;z-index:6}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.controls button{background:linear-gradient(#bd322f,#771425);color:#fff4c9;border:2px solid #f2bd59;border-radius:15px;padding:11px 3px;font-size:13px;font-weight:800;box-shadow:0 4px 15px #0009;min-height:63px}.controls button span{display:block;font-size:23px;margin-bottom:2px}.note{text-align:center;margin-top:8px;font-size:11px;color:#f9dca8;background:#081528b8;padding:5px;border-radius:9px}.mini{display:flex;gap:7px;justify-content:center;margin-bottom:9px}.mini button,.mini select{border:1px solid #dcb66e;background:#07172cdd;color:#fff2d2;border-radius:10px;padding:8px;font-size:12px}.mini select{max-width:160px}#spark{position:absolute;inset:0;pointer-events:none;z-index:4}.sparkle{position:absolute;font-size:26px;animation:rise 2s forwards;text-shadow:0 0 16px gold}@keyframes rise{from{transform:translateY(0) scale(.5);opacity:1}to{transform:translateY(-180px) scale(1.5);opacity:0}}@media(min-width:700px){#stage{max-width:500px;margin:auto;box-shadow:0 0 60px #000}}
</style></head><body><div id="stage"><canvas id="river"></canvas><div id="spark"></div><div class="top"><div class="tag">🪷 <b>@co5088co</b></div><div class="tag">🌹 <b id="roses">0</b>　🏮 <b id="total">0</b></div></div><div class="heading"><h1>THẢ ĐÈN CẦU PHÚC</h1><p>Nguyện bình an • Sức khỏe • Tài lộc</p></div><div class="buddha" id="buddha"><div class="halo"></div><span>🙏</span></div><div class="wish"><strong id="blessing">Cầu Bình An</strong><small>Thả hoa đăng, gửi lời nguyện ước ✨</small></div><div class="counter">🏆 Người cầu phúc<br><b id="leader">Chưa có lượt tặng</b></div><div class="toast" id="toast"></div><div class="bottom"><div class="mini"><select id="wishselect" aria-label="Chọn lời cầu"><option value="Cầu Bình An">🕊️ Bình An</option><option value="Cầu Sức Khỏe">💚 Sức Khỏe</option><option value="Cầu Tài Lộc">💰 Tài Lộc</option><option value="Cầu Hạnh Phúc">💞 Hạnh Phúc</option></select><button id="reset">↺ Làm mới</button><button id="full">⛶ Toàn màn hình</button></div><div class="controls"><button id="rose"><span>🌹</span>Hoa hồng ×1</button><button id="heart"><span>💗</span>Trái tim</button><button id="gift"><span>🎁</span>Quà lớn</button></div><div class="note">BẢN DEMO • Nhấn nút để thử • Chưa kết nối quà TikTok LIVE</div></div></div><script>
const canvas=document.getElementById('river'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');let W,H,lights=[],roseCount=0,total=0,rank={};const $=id=>document.getElementById(id);function resize(){W=canvas.width=stage.clientWidth*devicePixelRatio;H=canvas.height=stage.clientHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=stage.clientWidth;H=stage.clientHeight}addEventListener('resize',resize);resize();function addLamp(n=1,kind='pink'){for(let i=0;i<n;i++)lights.push({x:W*(.18+Math.random()*.64),y:H*(.77+Math.random()*.12),size:13+Math.random()*11,kind,phase:Math.random()*6.28,speed:.12+Math.random()*.16});if(lights.length>250)lights.splice(0,lights.length-250);total+=n;$('total').textContent=total}function draw(t){ctx.clearRect(0,0,W,H);for(const l of lights){l.y-=l.speed;l.x+=Math.sin(t/1500+l.phase)*.08;let depth=Math.max(.28,Math.min(1,(l.y/H-.42)/.4));let s=l.size*depth;ctx.save();ctx.translate(l.x,l.y);ctx.shadowBlur=18;ctx.shadowColor=l.kind==='gold'?'#ffd25a':'#ff7ac7';ctx.fillStyle=l.kind==='gold'?'#ffd67c':'#ff8bc4';ctx.globalAlpha=.3;ctx.beginPath();ctx.ellipse(0,4,s*1.8,s*.42,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.ellipse(i*s*.25,-s*.14,s*.23,s*.58,i*.18,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#fff5bc';ctx.beginPath();ctx.ellipse(0,-s*.24,s*.22,s*.3,0,0,Math.PI*2);ctx.fill();ctx.restore()}lights=lights.filter(l=>l.y>H*.48);requestAnimationFrame(draw)}requestAnimationFrame(draw);let toastTimer;function notify(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2300)}function sparkle(n){for(let i=0;i<n;i++){let e=document.createElement('div');e.className='sparkle';e.textContent=Math.random()>.45?'✨':'🪷';e.style.left=(15+Math.random()*70)+'%';e.style.top=(45+Math.random()*30)+'%';e.style.animationDelay=(Math.random()*.5)+'s';$('spark').append(e);setTimeout(()=>e.remove(),2600)}}function pulse(){let b=$('buddha');b.classList.remove('pulse');void b.offsetWidth;b.classList.add('pulse')}function updateRank(label){rank[label]=(rank[label]||0)+1;$('leader').textContent=Object.entries(rank).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([name,n])=>name+' '+n).join(' · ')}$('wishselect').onchange=e=>{$('blessing').textContent=e.target.value};$('rose').onclick=()=>{roseCount++;$('roses').textContent=roseCount;addLamp(1);updateRank('Khách thử 🌹');notify('🌹 +1 hoa đăng • Cầu bình an!')};$('heart').onclick=()=>{addLamp(3);pulse();sparkle(8);updateRank('Khách thử 💗');notify('💗 Hoa sen nở • Phúc lành!')};$('gift').onclick=()=>{addLamp(20,'gold');pulse();sparkle(30);updateRank('Khách thử 🎁');notify('🎁 Phật quang phổ chiếu!')};$('reset').onclick=()=>{lights=[];roseCount=total=0;rank={};$('roses').textContent='0';$('total').textContent='0';$('leader').textContent='Chưa có lượt tặng';notify('Đã làm mới')};$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else stage.requestFullscreen?.().catch(()=>notify('Dùng chế độ toàn màn hình Safari'))};window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data;if(d?.type==='demoGift'){if(d.gift==='rose')$('rose').click();if(d.gift==='heart')$('heart').click();if(d.gift==='large')$('gift').click()}});
</script></body></html>
